name: Build Honda ECU App from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract Project Zip on Server
      run: |
        # Cari file zip di dalam repository (misal: HondaEcuApp.zip) lalu ekstrak otomatis
        if ls *.zip 1> /dev/null 2>&1; then
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Menemukan file zip: $ZIP_FILE. Mengekstrak..."
          unzip -o "$ZIP_FILE" -d extracted_project/
        else
          echo "Tidak ada file zip ditemukan di root repository, mencari di sub-folder..."
        fi

    - name: Build Debug APK
      run: |
        # Masuk ke direktori hasil ekstrak (sesuaikan nama foldernya)
        cd extracted_project/HondaEcuApp || cd HondaEcuApp
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HondaEcuApp-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
        

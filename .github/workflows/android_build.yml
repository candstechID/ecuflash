name: Build CandsTech ECU Flasher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP and Locate Project
        run: |
          rm -rf extracted
          mkdir -p extracted
          ZIP=$(ls -t *.zip | head -n 1)
          echo "ZIP yang digunakan: $ZIP"
          unzip -q "$ZIP" -d extracted
          
          # Cari folder yang benar-benar mengandung file settings.gradle atau settings.gradle.kts
          REAL_PROJECT_DIR=$(find extracted -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$REAL_PROJECT_DIR" ]; then
            # Fallback jika tidak ketemu, cari build.gradle
            REAL_PROJECT_DIR=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
          fi
          
          if [ -z "$REAL_PROJECT_DIR" ]; then
            REAL_PROJECT_DIR="extracted"
          fi
          
          echo "PROJECT_DIR=$REAL_PROJECT_DIR"
          echo "PROJECT_DIR=$REAL_PROJECT_DIR" >> $GITHUB_ENV
          echo "Direktori proyek valid diset ke: $REAL_PROJECT_DIR"

      - name: Patch Gradle & SDK Version
        run: |
          PROJ="${{ env.PROJECT_DIR }}"
          echo "Direktori Proyek: $PROJ"
          
          # 1. Bersihkan root build.gradle dari konflik repositori lama
          ROOT_GRADLE=$(find "$PROJ" -maxdepth 2 -name "build.gradle*" ! -path "*/app/*" | head -n 1)
          if [ -n "$ROOT_GRADLE" ] && [ -f "$ROOT_GRADLE" ]; then
            echo "Menambal root build.gradle..."
            echo "plugins { id 'com.android.application' version '8.11.1' apply false }" > "$ROOT_GRADLE"
          fi

          # 2. Update compileSdk/targetSdk ke 36 pada app build.gradle
          APP_GRADLE=$(find "$PROJ" -name "build.gradle*" -path "*/app/*" | head -n 1)
          if [ -n "$APP_GRADLE" ] && [ -f "$APP_GRADLE" ]; then
            echo "Menambal app build.gradle ke SDK 36..."
            sed -i 's/compileSdk = 34/compileSdk = 36/g; s/targetSdk = 34/targetSdk = 36/g; s/compileSdk = 35/compileSdk = 36/g; s/targetSdk = 35/targetSdk = 36/g' "$APP_GRADLE" || true
            sed -i 's/compileSdk 34/compileSdk 36/g; s/targetSdk 34/targetSdk 36/g; s/compileSdk 35/compileSdk 36/g; s/targetSdk 35/targetSdk 36/g' "$APP_GRADLE" || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Ensure Gradle Wrapper & Build APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          
          # Jika file gradlew tidak ada di dalam folder proyek, buat wrapper otomatis
          if [ ! -f "gradlew" ]; then
            echo "File gradlew tidak ditemukan, membuat wrapper otomatis..."
            gradle wrapper --gradle-version 8.14
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandsTech-ECU-Flasher-Debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

name: Build CandsTech ECU Flasher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and Auto-Flatten ZIP Structure
        run: |
          rm -rf extracted
          mkdir -p extracted
          ZIP=$(ls -t *.zip | head -n 1)
          echo "ZIP yang digunakan: $ZIP"
          unzip -q "$ZIP" -d extracted
          
          # Cari di mana letak file settings.gradle atau build.gradle utama
          PROJECT_ROOT=$(find extracted -name "settings.gradle*" -o -name "build.gradle*" -exec dirname {} \; | head -n 1)
          
          if [ -n "$PROJECT_ROOT" ] && [ "$PROJECT_ROOT" != "." ]; then
            echo "Menemukan root proyek di: $PROJECT_ROOT. Merapikan ke root utama..."
            shopt -s dotglob
            mv "$PROJECT_ROOT"/* .
            rm -rf extracted
          else
            echo "Struktur ZIP sudah di root."
          fi

      - name: Patch Gradle & SDK Version
        run: |
          # 1. Bersihkan root build.gradle dari konflik repositori lama jika ada
          if [ -f "build.gradle" ]; then
            echo "Menambal root build.gradle..."
            echo "plugins { id 'com.android.application' version '8.11.1' apply false }" > build.gradle
          elif [ -f "build.gradle.kts" ]; then
            echo "Menambal root build.gradle.kts..."
            echo "plugins { id(\"com.android.application\") version \"8.11.1\" apply false }" > build.gradle.kts
          fi

          # 2. Update compileSdk/targetSdk ke 36 pada app build.gradle / build.gradle.kts
          APP_GRADLE=$(find . -name "build.gradle*" -path "*/app/*" | head -n 1)
          if [ -n "$APP_GRADLE" ] && [ -f "$APP_GRADLE" ]; then
            echo "Menambal app build.gradle ke SDK 36..."
            sed -i 's/compileSdk = 34/compileSdk = 36/g; s/targetSdk = 34/targetSdk = 36/g; s/compileSdk = 35/compileSdk = 36/g; s/targetSdk = 35/targetSdk = 36/g' "$APP_GRADLE" || true
            sed -i 's/compileSdk 34/compileSdk 36/g; s/targetSdk 34/targetSdk 36/g; s/compileSdk 35/compileSdk 36/g; s/targetSdk 35/targetSdk 36/g' "$APP_GRADLE" || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Ensure Gradle Wrapper & Build APK
        run: |
          # Jika file gradlew belum ada di root, buat wrapper otomatis
          if [ ! -f "gradlew" ]; then
            echo "File gradlew tidak ditemukan, membuat wrapper otomatis..."
            gradle wrapper --gradle-version 8.14
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandsTech-ECU-Flasher-Debug
          path: app/build/outputs/apk/debug/*.apk

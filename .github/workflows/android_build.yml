name: Build CandsTech ECU Flasher from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract ZIP & Build
      run: |
        # Cari file ZIP dan ekstrak
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Menemukan ZIP: $ZIP_FILE. Mengekstrak..."
          unzip -o "$ZIP_FILE" -d temp_extracted
          shopt -s dotglob
          FIRST_DIR=$(ls -d temp_extracted/*/ 2>/dev/null | head -n 1)
          if [ -n "$FIRST_DIR" ]; then
            mv "${FIRST_DIR}"* .
          else
            mv temp_extracted/* .
          fi
          rm -rf temp_extracted "$ZIP_FILE"
        fi

        # Buat build.gradle modern jika belum ada/bermasalah
        cat << 'EOF' > build.gradle
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
EOF

        # Generate gradle wrapper jika belum ada
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.4
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: candstech-ecu-flasher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

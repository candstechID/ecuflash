name: Build Candstech app from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Candstech Diag source ZIP
        id: srczip
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          ZIP_FILE=""

          # Mencari file ZIP apa saja di root repository
          ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f -iname '*.zip' -print | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ditemukan file .zip di root repository. Pastikan Anda mengunggah file ZIP ke halaman utama repository."
            exit 1
          fi

          echo "Menggunakan source ZIP: $(basename "$ZIP_FILE")"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP on runner
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/candstech-src"
          mkdir -p "$DEST"
          unzip -q "${{ steps.srczip.outputs.file }}" -d "$DEST"

          SETTINGS_FILE="$(find "$DEST" -mindepth 1 -maxdepth 5 -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan dalam ZIP."
            exit 1
          }

          SRC_DIR="$(dirname "$SETTINGS_FILE")"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

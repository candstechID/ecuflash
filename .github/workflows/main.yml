name: Build ECU App from Zip

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        id: srczip
        run: |
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found in root!"
            exit 1
          fi
          echo "file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Extract ZIP & Clean Cache
        run: |
          DEST="$RUNNER_TEMP/src"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "${{ steps.srczip.outputs.file }}" -d "$DEST"
          
          SETTINGS_FILE="$(find "$DEST" -mindepth 1 -maxdepth 5 -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find "$DEST" -mindepth 1 -maxdepth 5 -type f -name settings.gradle -print -quit)"
          fi
          SRC_DIR="$(dirname "$SETTINGS_FILE")"
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV
          
          # Hapus cache lokal Gradle di dalam proyek yang mungkin ikut ter-zip
          rm -rf "$SRC_DIR/.gradle"
          rm -rf "$SRC_DIR/app/build"
          
          # Force inject settings.gradle.kts yang bersih dan benar
          cat << 'EOF' > "$SRC_DIR/settings.gradle.kts"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "HondaEcuApp"
          include(":app")
          EOF

      - name: Build debug APK with Fresh Cache
        working-directory: ${{ env.SRC_DIR }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew
          
          # Bersihkan cache Gradle global runner dan jalankan clean build
          rm -rf ~/.gradle/caches/
          ./gradlew clean assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: candstech-diag-debug-apk
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk

name: Build ECU App from Zip

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        id: srczip
        run: |
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found in root!"
            exit 1
          fi
          echo "file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Extract ZIP & Force Inject settings.gradle.kts
        run: |
          DEST="$RUNNER_TEMP/src"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "${{ steps.srczip.outputs.file }}" -d "$DEST"
          
          # Cari folder tempat app atau build.gradle.kts berada
          APP_BUILD="$(find "$DEST" -name "build.gradle.kts" -path "*/app/*" -print -quit)"
          if [ -z "$APP_BUILD" ]; then
            APP_BUILD="$(find "$DEST" -name "build.gradle" -path "*/app/*" -print -quit)"
          fi
          
          if [ -z "$APP_BUILD" ]; then
            echo "Error: Struktur proyek Android tidak ditemukan di dalam ZIP!"
            exit 1
          fi
          
          APP_DIR="$(dirname "$APP_BUILD")"
          SRC_DIR="$(dirname "$APP_DIR")"
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV
          
          # Hapus cache lama jika ada
          rm -rf "$SRC_DIR/.gradle"
          rm -rf "$APP_DIR/build"
          
          # Tulis ulang settings.gradle.kts di root proyek secara paksa agar pluginManagement pasti ada
          echo "Membuat settings.gradle.kts dengan pluginManagement..."
          cat << 'EOF' > "$SRC_DIR/settings.gradle.kts"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "HondaEcuApp"
          include(":app")
          EOF

      - name: Build debug APK with Clean Cache
        working-directory: ${{ env.SRC_DIR }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew
          
          rm -rf ~/.gradle/caches/
          ./gradlew clean assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: candstech-diag-debug-apk
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk

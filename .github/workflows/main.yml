name: Build Candstech Diag from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find source ZIP
        id: srczip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: File ZIP tidak ditemukan di root repository!"
            exit 1
          fi
          echo "file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Extract source ZIP
        run: |
          mkdir -p extracted_src
          unzip -q "${{ steps.srczip.outputs.file }}" -d extracted_src
          
          # Cari letak settings.gradle atau settings.gradle.kts
          SETTINGS=$(find extracted_src -name "settings.gradle*" -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Error: settings.gradle(.kts) tidak ditemukan di dalam ZIP!"
            exit 1
          fi
          SRC_DIR=$(dirname "$SETTINGS")
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: ${{ env.SRC_DIR }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: candstech-diag-debug-apk
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk

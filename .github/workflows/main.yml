name: Build CandsTech ECU Flasher from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        # Cari file ZIP di root repository dan ekstrak
        ZIP_FILE=$(ls *.zip | head -n 1)
        if [ -f "$ZIP_FILE" ]; then
          echo "Menemukan file ZIP: $ZIP_FILE. Mengekstrak..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          # Pindahkan isi ekstraksi ke root repository agar terbaca oleh gradle
          shopt -s dotglob
          mv extracted_project/* .
          rm -rf extracted_project "$ZIP_FILE"
        else
          echo "Tidak ada file ZIP ditemukan. Melanjutkan dengan struktur folder biasa..."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: candstech-ecu-flasher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

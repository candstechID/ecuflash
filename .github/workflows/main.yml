name: Build CandsTech ECU Flasher from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Smart Extract Uploaded ZIP
      run: |
        echo "Mencari file ZIP..."
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Menemukan ZIP: $ZIP_FILE. Mengekstrak..."
          unzip -o "$ZIP_FILE" -d temp_extracted
          
          # Pindahkan isi ke root folder secara otomatis (menangani folder pembungkus)
          shopt -s dotglob
          if [ -d "temp_extracted/candstech_ecu_flasher" ]; then
            mv temp_extracted/candstech_ecu_flasher/* .
          elif [ -d "temp_extracted/app" ]; then
            mv temp_extracted/* .
          else
            # Jika di dalam zip langsung berupa isi project
            mv temp_extracted/* .
          fi
          rm -rf temp_extracted "$ZIP_FILE"
          echo "Struktur file berhasil dirapikan di root server."
        else
          echo "Tidak ada file ZIP, menggunakan struktur folder yang ada."
        fi
        
        # Cek keberadaan gradlew
        if [ ! -f "gradlew" ]; then
          echo "ERROR: File gradlew tetap tidak ditemukan! Pastikan file ZIP Anda berisi root project Android."
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: candstech-ecu-flasher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

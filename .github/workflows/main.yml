name: Build CandsTech ECU Flasher from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Smart Extract Uploaded ZIP
      run: |
        echo "Mencari file ZIP..."
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Menemukan ZIP: $ZIP_FILE. Mengekstrak..."
          unzip -o "$ZIP_FILE" -d temp_extracted
          
          # Pindahkan isi dari folder apa pun di dalam temp_extracted ke root
          shopt -s dotglob
          if [ -d "temp_extracted/candstech_ecu_flasher" ]; then
            mv temp_extracted/candstech_ecu_flasher/* .
          elif [ -d "temp_extracted/candstech" ]; then
            mv temp_extracted/candstech/* .
          else
            # Ambil folder pertama hasil ekstraksi apa pun namanya
            FIRST_DIR=$(ls -d temp_extracted/*/ 2>/dev/null | head -n 1)
            if [ -n "$FIRST_DIR" ]; then
              mv "${FIRST_DIR}"* .
            else
              mv temp_extracted/* .
            fi
          fi
          rm -rf temp_extracted "$ZIP_FILE"
          echo "Struktur file berhasil dirapikan di root server."
        else
          echo "Tidak ada file ZIP, menggunakan struktur folder yang ada."
        fi
        
        # Cek keberadaan gradlew
        if [ ! -f "gradlew" ]; then
          echo "Peringatan: gradlew belum ada di root, mencoba mencari di subfolder..."
          find . -name "gradlew" -exec cp {} . \;
        fi
        
        if [ ! -f "gradlew" ]; then
          echo "ERROR: File gradlew tetap tidak ditemukan!"
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: candstech-ecu-flasher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

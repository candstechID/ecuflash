name: Build CandsTech ECU Flasher from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Smart Extract ZIP & Fix Gradle Config
      run: |
        echo "Mencari file ZIP..."
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Menemukan ZIP: $ZIP_FILE. Mengekstrak..."
          unzip -o "$ZIP_FILE" -d temp_extracted
          
          # Pindahkan isi ekstraksi ke root folder
          shopt -s dotglob
          if [ -d "temp_extracted/candstech" ]; then
            mv temp_extracted/candstech/* .
          elif [ -d "temp_extracted/candstech_ecu_flasher" ]; then
            mv temp_extracted/candstech_ecu_flasher/* .
          else
            FIRST_DIR=$(ls -d temp_extracted/*/ 2>/dev/null | head -n 1)
            if [ -n "$FIRST_DIR" ]; then
              mv "${FIRST_DIR}"* .
            else
              mv temp_extracted/* .
            fi
          fi
          rm -rf temp_extracted "$ZIP_FILE"
          echo "Ekstraksi selesai."
        fi

        # OTOMATIS PERBAIKI BUILD.GRADLE DI SERVER (Hapus task clean lama yang error)
        if [ -f "build.gradle" ]; then
          echo "Memperbaiki build.gradle agar kompatibel dengan Gradle modern..."
          cat << 'EOF' > build.gradle
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
EOF
          echo "build.gradle berhasil ditambal otomatis."
        fi

        # Pastikan gradle wrapper ada
        if [ ! -f "gradlew" ]; then
          echo "Membuat file gradlew otomatis..."
          gradle wrapper --gradle-version 8.4
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: candstech-ecu-flasher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

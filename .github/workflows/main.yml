name: Build CandsTech ECU Flasher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Membuat tombol 'Run workflow' manual di tab Actions

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract ZIP if uploaded
      run: |
        # Jika ada file ZIP, ekstrak otomatis
        if ls *.zip 1> /dev/null 2>&1; then
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Mengekstrak ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_dir
          shopt -s dotglob
          # Pindahkan isi jika terbungkus folder
          if [ -d "extracted_dir/candstech_ecu_flasher" ]; then
            mv extracted_dir/candstech_ecu_flasher/* .
          else
            mv extracted_dir/* .
          fi
          rm -rf extracted_dir "$ZIP_FILE"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: candstech-ecu-flasher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

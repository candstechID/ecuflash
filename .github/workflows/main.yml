name: Build CandsTech ECU Flasher from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memunculkan tombol 'Run workflow' manual di tab Actions

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Uploaded ZIP on Server
      run: |
        echo "Mencari file ZIP di server..."
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Menemukan file ZIP: $ZIP_FILE. Mengekstrak..."
          unzip -o "$ZIP_FILE" -d extracted_temp
          
          # Pindahkan isi ekstraksi ke root direktori
          shopt -s dotglob
          if [ -d "extracted_temp/candstech_ecu_flasher" ]; then
            mv extracted_temp/candstech_ecu_flasher/* .
          else
            mv extracted_temp/* .
          fi
          rm -rf extracted_temp "$ZIP_FILE"
          echo "Ekstraksi selesai dan file ZIP dibersihkan."
        else
          echo "Tidak ada file ZIP baru, menggunakan struktur folder yang ada."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: candstech-ecu-flasher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

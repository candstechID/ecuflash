name: Build ECU App from Zip

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        id: srczip
        run: |
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found in root!"
            exit 1
          fi
          echo "file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Extract ZIP & Fix Gradle / Manifest / Kotlin
        run: |
          DEST="$RUNNER_TEMP/src"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "${{ steps.srczip.outputs.file }}" -d "$DEST"
          
          APP_BUILD="$(find "$DEST" -name "build.gradle*" -path "*/app/*" -print -quit)"
          if [ -z "$APP_BUILD" ]; then
            echo "Error: Folder app tidak ditemukan di dalam ZIP!"
            exit 1
          fi
          
          APP_DIR="$(dirname "$APP_BUILD")"
          SRC_DIR="$(dirname "$APP_DIR")"
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV
          
          rm -rf "$SRC_DIR/.gradle" "$APP_DIR/build"
          
          # 1. Buat settings.gradle.kts
          cat << 'EOF' > "$SRC_DIR/settings.gradle.kts"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "HondaEcuApp"
          include(":app")
          EOF

          # 2. Buat root build.gradle.kts
          cat << 'EOF' > "$SRC_DIR/build.gradle.kts"
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.10" apply false
          }
          EOF

          # 3. Buat gradle.properties
          cat << 'EOF' > "$SRC_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 4. Ganti dependency UsbSerial menjadi usb-serial-for-android (com.hoho.android.usbserial)
          sed -i 's/com.github.felhr85:UsbSerial:6.1.0/com.github.mik3y:usb-serial-for-android:3.7.0/g' "$APP_BUILD"

          # 5. Perbaiki typo logButton -> logBuffer di MainActivity.kt
          MAIN_KT="$APP_DIR/src/main/java/com/candstech/hondaecutool/MainActivity.kt"
          if [ -f "$MAIN_KT" ]; then
            sed -i 's/logButton/logBuffer/g' "$MAIN_KT"
          fi

          # 6. Perbaiki AndroidManifest.xml
          MANIFEST_FILE="$APP_DIR/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/android:icon="@mipmap\/ic_launcher"//g' "$MANIFEST_FILE"
            sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$MANIFEST_FILE"
            sed -i 's/@style\/Theme.Material3.DayNight.NoActionBar/@android:style\/Theme.DeviceDefault.NoActionBar/g' "$MANIFEST_FILE"
            sed -i 's/@style\/Theme.HondaEcuTool/@android:style\/Theme.DeviceDefault.NoActionBar/g' "$MANIFEST_FILE"
          fi

      - name: Setup Gradle 8.5 & Build Debug APK
        working-directory: ${{ env.SRC_DIR }}
        run: |
          rm -rf ~/.gradle/caches/
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle clean assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: candstech-diag-debug-apk
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk
